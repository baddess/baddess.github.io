<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naima's Homemade Cake</title>

    <style>
        body {
            background-color: lightgray;
            margin: 0;
            padding: 32px 4%;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .shop-container {
            display: flex;
            align-items: flex-start;
            gap: 55px;
        }

        .shop-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 25px;
        }

        .shop-info {
            padding-top: 5px;
        }

        .categories {
            font-size: 22px;
            color: black;
            margin-bottom: 10px;
        }

        .shop-name {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 35px 0;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .open {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #dcf7e5;
            color: #16833d;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
        }

        .green-circle {
            width: 15px;
            height: 15px;
            background-color: #19d13b;
            border: 2px solid #000;
            border-radius: 50%;
        }

        .cake-shop {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #fff0eb;
            padding: 0.1px 15px;
            border-radius: 35px;
            font-size: 15px;
            font-weight: bold;
        }

        .trophy {
            font-size: 28px;
        }

        @media (max-width: 900px) {
            .shop-container {
                flex-direction: column;
                gap: 30px;
            }

            .shop-image {
                width: 100%;
                max-width: 410px;
                height: auto;
            }

            .categories {
                font-size: 25px;
            }

            .shop-name {
                font-size: 40px;
            }

            .status-container {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="shop-container">

        <img 
            src="logo.jpeg" 
            
            class="shop-image"
        >

        <div class="shop-info">

            <!-- Categories -->
            <div class="categories">
                Cakes · Dessert · Fast Food
            </div>

            <!-- Shop Name -->
            <h1 class="shop-name">
                Naima's Homemade Cake
                
            </h1>

            <!-- Open + Super Restaurant -->
            <div class="status-container">

                <div class="open">
                    <span class="green-circle"></span>
                    OPEN
                </div>

                <div class="cake-shop">
                    <span class="trophy">🏆</span>
                    Cake Shop
                </div>

            </div>

        </div>

    </div>

</body>
</html>
